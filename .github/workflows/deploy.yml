name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкладка идёт пушем в ветку gh-pages, поэтому нужна запись в содержимое.
# Разрешения pages/id-token больше не нужны: очередь Pages-деплоя из Actions
# не используется (см. комментарий у шага публикации).
permissions:
  contents: write

# Параллельные выкладки не нужны: держим одну активную, но не рвём уже идущую
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        # base задаётся здесь, а не в vite.config.ts: путь публикации — свойство
        # деплоя, а не исходников. Абсолютный base обязателен, потому что SPA-фолбэк
        # отдаёт index.html на любой путь: при относительном './' адрес со слэшем
        # на конце (/meat2/prefreim/) разрешал бы ассеты в несуществующий
        # /meat2/prefreim/assets/ и давал белый экран.
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Переменные сборки. Пустые значения безопасны: слот видео показывает
          # честное «материал пока не подключён», кнопка на внешний ресурс
          # становится неактивной с подписью (docs/SPEC.md §3.5, §3.6).
          VITE_VIDEO_1_URL: ${{ vars.VITE_VIDEO_1_URL }}
          VITE_VIDEO_2_URL: ${{ vars.VITE_VIDEO_2_URL }}
          VITE_VIDEO_3_URL: ${{ vars.VITE_VIDEO_3_URL }}
          VITE_ASSISTANT_AUDIENCE_URL: ${{ vars.VITE_ASSISTANT_AUDIENCE_URL }}
          VITE_ASSISTANT_OFFER_URL: ${{ vars.VITE_ASSISTANT_OFFER_URL }}
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}

      - name: SPA fallback
        # GitHub Pages отдаёт 404 на любой путь кроме корня. Копия index.html
        # под именем 404.html делает маршрут /meat2/... рабочим при прямом заходе.
        run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        # Публикуем пушем в ветку, а НЕ через actions/deploy-pages.
        #
        # Почему: 06.08.2026 очередь Pages-деплоя из Actions переставала
        # забирать готовый артефакт. Экшен ждёт максимум 10 минут — это его
        # жёсткий потолок, увеличить нельзя (`timeout value is greater than
        # the allowed maximum`), — после чего САМ отменяет деплой. Отменённый
        # деплой затем блокирует все следующие, потому что его идентификатор
        # равен хэшу коммита, и выкладка встаёт намертво.
        #
        # Пуш в ветку идёт через отдельный конвейер Pages и от этой очереди не
        # зависит. Чтобы вернуться на прежнюю схему: восстановить шаги
        # configure-pages/upload-pages-artifact/deploy-pages, вернуть
        # разрешения pages+id-token и переключить источник Pages обратно на
        # GitHub Actions в настройках репозитория.
        run: |
          cd dist
          # .nojekyll обязателен: без него Pages прогоняет выкладку через
          # Jekyll и выбрасывает всё, что начинается с подчёркивания.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Выкладка ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
