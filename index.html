    <!-- Грейд первого акта: старт сразу в мертвенном офисном свете, без вспышки -->
    <meta name="theme-color" content="#2B2A26" />
    <title>Во всём виноват ты</title>
    <!--
      КОНТРАКТ НАПРАВЛЕНИЯ

      THESIS: Воронка ведёт человека по этапам, и это обязано быть ВИДНО, а не
      только прочитано. Приём взят у сериала целиком: у каждого акта истории
      свой цветовой грейд, и герой к финалу физически не там, где начал.
      Отказ — от абстрактных метафор: первая версия была миром-садом с каплями
      и отвергнута заказчиком как «мягко, поэтично, скучно, всё абстрактно».

      OWN-WORLD: Шесть грейдов на 14 шагов. I Обвинение — люминесцентный офис,
      выцветший беж #2B2A26, мертвенный белый свет, ни одной тени. II Тупик —
      пустынная пыль, выгоревший песок, жёсткое солнце, длинные тени.
      III Разбор — холодная сталь, приглушённый синий, точный свет.
      IV Формула — кислотный жёлто-зелёный, свет изнутри вещества. V Допуск —
      тревожный красный на чёрном, лампа сверху, остальное в темноте.
      VI Контроль — глубокая сталь и янтарь, ровный тёплый свет. Материал:
      зерно плёнки, пыль, царапины, виньетка — стерильных заливок нет.
      Прогресс предметный: бейдж допуска меняет статус по ходу.

      STORY: Человек приходит обвинённым клиентом и уверенным, что чинить надо
      рекламный кабинет. Понимает, что два из трёх мест утечки лежат вне
      кабинета, сдаёт допуск и покупает практикум за 3 990 ₽.

      FIRST VIEWPORT: Мертвенный свет офисной панели сверху. Чужой экран, на
      котором клиент пишет и стирает свои же сообщения, всё быстрее.
      Последнее остаётся крупным во весь кадр: «Короче, во всём виноват ты».
      Одно действие внизу: «Да, было такое».

      FORM: Мир задан заказчиком напрямую («референс — Во все тяжкие», «всё
      вместе, как в сериале») и бьёт жребий: пиннутое направление всегда
      сильнее раздачи. Ключа сида здесь поэтому НЕТ и быть не может — раздача
      не проводилась осознанно, а не пропущена по недосмотру. Ставка —
      цветовой сценарий как несущая конструкция, а не как оформление.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
