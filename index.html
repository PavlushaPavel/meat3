    <title>Сад обратной гравитации</title>
    <!--
      КОНТРАКТ НАПРАВЛЕНИЯ

      THESIS: Один и тот же поисковый запрос — это разные люди, летящие по разным
      законам. Воронка отказывается от конуса, ступенек и дашборда: здесь не
      «этапы», а поле гравитации, в котором капля выбирает свой путь по цвету
      облака.

      OWN-WORLD: Сумеречный моховой сад #2F3A36 как земля; четыре именованных
      закона несут все состояния — UPDRAFT #7DB8E6 вверх, DEFLECT #E0645B в
      сторону, ORBIT #E7E8E4 по кругу, ANCHOR #0E0F10 в центре. Длинное чтение
      лежит на облачной бумаге #EDEAE0. Дисплей Unbounded по гнутой базовой
      линии, тело Onest ровно, легенда JetBrains Mono всегда ровно. Компоненты:
      таблетки с каплевым столбцом, карточки облачной бумаги, орбита капель как
      счётчик жизней, пруд наверху вместо плеера.

      STORY: Человек приходит обвинённым клиентом и уверенным, что чинить надо
      рекламный кабинет. Он понимает, что два из трёх мест утечки лежат вне
      кабинета, сдаёт допуск и покупает практикум за 3 990 ₽.

      FIRST VIEWPORT: Во весь экран сумеречный сад, дождь падает вниз и уходит в
      землю. Поверх — чат клиента: красные капли-сообщения появляются и стираются,
      ускоряясь. Последнее остаётся крупным: «Короче, во всём виноват ты».
      Основное действие — одна таблетка внизу: «Да, было такое».

      FORM: Сад обратной гравитации — карточка-вызов из раздачи, выбранная
      заказчиком поверх назначенного жребием направления (жребий назначил третью
      позицию собственного списка — промышленную схему связки). Ставка: тёмная
      земля с полем частиц, длинное чтение на облачной бумаге. Ключ сида c506df4f.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
