    <title>Партия забракована</title>
    <!--
      КОНТРАКТ НАПРАВЛЕНИЯ

      THESIS: Воронка — не главы обучения, а СИНТЕЗ ПАРТИИ. Человек варит
      связку: сырьё, кого приводим → реакция, что обещаем → чистый продукт,
      куда приводим. Лаборатория здесь буквальный смысл, а не декорация, и
      приборы в ней ИИ-шные — именно ИИ и есть новый инструмент, о котором
      говорит воронка. Отказ: от кинематографических грейдов прошлой версии,
      признанных заказчиком неузнаваемыми.

      OWN-WORLD: Три приметы, выбранные заказчиком, и больше ничего.
      (1) ПОКАЗАТЕЛЬ ЧИСТОТЫ — единственный индикатор пути, живое приборное
      показание, набегает цифрами: 00.0% на браке, 99.1% на чистом продукте.
      (2) СИНИЙ КРИСТАЛЛ — сам продукт, растёт гранями и светлеет от этапа к
      этапу, никогда не уменьшается. (3) ЖЁЛТАЯ ОПАСНАЯ РАЗМЕТКА — только брак
      и провал контроля, этапы 1 и 5, иначе перестаёт значить опасность.
      Запрещено: колбы, клетки элементов, подвальные чаны, абстрактные символы.

      STORY: Клиент вернул забракованную партию и обвинил тебя. Ты находишь,
      что две из трёх точек потери качества лежат вне рекламного кабинета,
      проходишь контроль партии и покупаешь практикум за 3 990 ₽.

      FIRST VIEWPORT: Жёлтая опасная разметка по кадру, показатель чистоты
      стоит на 00.0%, кристалла нет. Сообщения клиента гаснут одно за другим —
      это отбраковка, а не разговор. Последнее остаётся крупным: «Короче, во
      всём виноват ты». Одно действие внизу: «Да, было такое».

      FORM: Мир задан заказчиком напрямую и по пунктам (три приметы выбраны из
      списка, слой ИИ — приборы с живыми показаниями, этапы пересобрать под
      логику синтеза). Раздача не проводилась осознанно: пиннутое направление
      всегда сильнее жребия, поэтому ключа сида здесь нет и быть не может.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
