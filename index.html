    <!--
      КОНТРАКТ НАПРАВЛЕНИЯ

      THESIS: Traffic Town — город интернет-маркетинга. Человек приходит в него
      специалистом по одному району: Директ, Авито или VK. Клиенту при этом
      плевать, насколько хорошо он управляет своим районом, — продажа проходит
      через весь город. Воронка расширяет карту, а не учит новому инструменту.

      OWN-WORLD: Две территории и одна граница.
      (1) TRAFFIC TOWN отвечает за КАРТИНУ МИРА: карта с туманом, где в начале
      открыт один район, а в конце видна вся дорога от человека до отдела
      продаж. Карта — единственный индикатор прогресса.
      (2) TRAFFIC LAB отвечает за ОБУЧЕНИЕ: подпольная лаборатория рекламных
      гипотез, три протокола, контроль качества, сборочный цех.
      (3) SALES DEPARTMENT не открывается НИКОГДА. Это и есть честный тезис
      продукта: ты не контролируешь продажу целиком.
      Запрещено: кристаллы, показатели чистоты, колбы вне теста, лор про
      «агента 77», неон на неоткрытых зонах.

      STORY: Клиент написал, что во всём виноват ты. Ты обнаруживаешь, что две
      из трёх точек потери качества лежат вне рекламного кабинета, получаешь
      доступ в TRAFFIC LAB, сдаёшь контроль качества и покупаешь практикум за
      3 990 ₽ — собственную сборочную линию.

      FIRST VIEWPORT: Ночной город. Крупно TRAFFIC TOWN, второе слово горит
      кислотным неоном. Под ним потёртая жёлтая лента и две строки: город, где
      каждый отвечает за свой кусок трафика, а виноват всегда один и тот же
      человек. Внизу силуэт промзоны и одно действие: «Найти свой район».

      FORM: Мир задан заказчиком напрямую — присланной структурой и одним
      референсом (ночная карта, кислотный неон маршрута, жёлтые опасные
      таблички, металл, «Во все тяжкие» без наркотиков). Раздача направлений не
      проводилась: пиннутое направление всегда сильнее жребия.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
